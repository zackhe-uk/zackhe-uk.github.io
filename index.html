<!doctype HTML>
<html>
  <head>
    <title>
      zackhe.uk
    </title>
    <meta name="title" property="og:title"       content="zackhe.uk" />
    <meta name="description" property="og:description" content="We're so back!" />
    <meta property="og:type" content="website" /> 
    <meta property="og:url" content="https://zackhe.uk" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
      html, body {
        color: white;
        overflow: hidden;
        height: 100%;
        margin: 0px;
        font-family: "Arial", "Roboto";
        animation: animbg 4s infinite alternate ease-in-out;
      }
      #siteWrap {
        overflow: hidden;
        display: block;
        text-align: center;
        height: 100%;
      }
      #header {
        position: relative;
        top: 50%;
        transform: translateY(-50%);
        animation: animhd 1s infinite alternate ease-in-out;
      }
      @keyframes animhd {
        from {
          color: darkblue;
        }
      
        to {
          color: blue;
        }
      }
      @keyframes animbg {
        from {
          background: #0a0a0a;
        }
      
        to {
          background: black;
        }
      }
    </style>
  </head>
  <body>
    <div id="siteWrap">
      <div id="header">
        <span>Expect something to be here... <b>soon</b>.</span><br><br>
        <a href="pong" style="color: gray !important; font-size: 10pt;">In the meantime, who's up for pong?</a>
      </div>
    </div>
  </body>
</html>
